apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: order-service-env
  namespace: apps
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: order-service-env
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: apps/order-service
