apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: macprod-gateway
  namespace: kube-system
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 30080
      hostname: "*.macprod.internal"
      allowedRoutes:
        namespaces:
          from: All
    - name: http-any
      protocol: HTTP
      port: 30080
      allowedRoutes:
        namespaces:
          from: All
