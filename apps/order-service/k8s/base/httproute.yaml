apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: order-service-route
  namespace: apps
spec:
  parentRefs:
    - name: macprod-gateway
      namespace: kube-system
  hostnames:
    - "order.macprod.internal"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: order-service-stable
          port: 80
          weight: 100
        - name: order-service-canary
          port: 80
          weight: 0
