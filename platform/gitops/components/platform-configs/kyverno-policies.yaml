apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
spec:
  validationActions:
    - Deny
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: apps
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: >
        object.spec.containers.all(c, c.image.contains(':') && !c.image.endsWith(':latest'))
      message: "Using ':latest' or untagged images is disallowed in 'apps' namespace. Pin an explicit version tag."
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-resource-requests-limits
spec:
  validationActions:
    - Deny
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: apps
    objectSelector:
      matchExpressions:
        - key: cnpg.io/cluster
          operator: DoesNotExist
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: >
        object.spec.containers.all(c, has(c.resources) && has(c.resources.requests) && ('memory' in c.resources.requests) && has(c.resources.limits) && ('memory' in c.resources.limits))
      message: "All containers in 'apps' namespace must declare memory requests and limits."
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-privilege-escalation
spec:
  validationActions:
    - Deny
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: apps
    objectSelector:
      matchExpressions:
        - key: cnpg.io/cluster
          operator: DoesNotExist
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: >
        object.spec.containers.all(c, has(c.securityContext) && has(c.securityContext.allowPrivilegeEscalation) && c.securityContext.allowPrivilegeEscalation == false)
      message: "Containers in 'apps' namespace must explicitly set securityContext.allowPrivilegeEscalation=false."
