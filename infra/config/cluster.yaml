# Single Source of Truth (SSOT) for Option A: Prod-in-a-Mac
project: macprod
domain: macprod.internal
base_image: ghcr.io/cirruslabs/ubuntu:latest

ssh:
  user: admin
  default_password: admin
  private_key_path: ~/.ssh/macprod_ed25519

kubernetes:
  version: "1.32"
  pod_cidr: "10.244.0.0/16"
  service_cidr: "10.96.0.0/12"
  api_port: 6443

versions:
  cilium: "1.20.5"
  gateway_api: "v1.6.3"
  argocd_chart: "10.18.2"
  argo_rollouts_chart: "2.43.12"
  argo_rollouts_gwapi_plugin: "v0.18.0"
  cert_manager_chart: "v1.21.3"
  external_secrets_chart: "2.15.0"
  kyverno_chart: "3.10.0"
  cnpg_chart: "0.29.2"
  velero_chart: "12.2.5"
  kube_prometheus_stack_chart: "93.9.0"
  loki_chart: "7.7.0"
  promtail_chart: "6.17.1"
  tempo_chart: "1.24.4"
  otel_collector_chart: "0.182.0"
  local_path_provisioner: "v0.0.31"
  seaweedfs_image: "chrislusf/seaweedfs:4.55"
  zot_image: "ghcr.io/project-zot/zot:v2.1.2"
  gitea_image: "gitea/gitea:1.22"
  vault_image: "hashicorp/vault:1.18.3"
  haproxy_image: "haproxy:3.0-alpine"

nodes:
  - name: macprod-ops
    role: ops
    cpu: 2
    memory: 6144
    disk_gb: 35
  - name: macprod-cp-1
    role: control_plane
    bootstrap: true
    cpu: 2
    memory: 4096
    disk_gb: 30
  - name: macprod-cp-2
    role: control_plane
    bootstrap: false
    cpu: 2
    memory: 4096
    disk_gb: 30
  - name: macprod-cp-3
    role: control_plane
    bootstrap: false
    cpu: 2
    memory: 4096
    disk_gb: 30
  - name: macprod-wk-1
    role: worker
    cpu: 3
    memory: 10240
    disk_gb: 45
  - name: macprod-wk-2
    role: worker
    cpu: 3
    memory: 10240
    disk_gb: 45
  - name: macprod-wk-3
    role: worker
    cpu: 3
    memory: 10240
    disk_gb: 45
