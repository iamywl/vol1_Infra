---
- name: Check kubelet/kubernetes state on bootstrap control plane
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: admin_conf_stat
  when: bootstrap_leader | default(false) | bool

- name: Query installed kubeadm version on bootstrap leader
  ansible.builtin.command: kubeadm version -o short
  register: kubeadm_ver_cmd
  changed_when: false
  when: bootstrap_leader | default(false) | bool

- name: Render kubeadm HA ClusterConfiguration on bootstrap leader
  ansible.builtin.template:
    src: kubeadm-config.yaml.j2
    dest: /etc/kubernetes/kubeadm-config.yaml
    mode: "0600"
  vars:
    kubeadm_short_version: "{{ kubeadm_ver_cmd.stdout | trim }}"
  when:
    - bootstrap_leader | default(false) | bool
    - not admin_conf_stat.stat.exists

- name: Initialize HA Kubernetes cluster on bootstrap leader
  ansible.builtin.command: kubeadm init --config=/etc/kubernetes/kubeadm-config.yaml --upload-certs
  when:
    - bootstrap_leader | default(false) | bool
    - not admin_conf_stat.stat.exists

- name: Ensure admin user kubeconfig exists on bootstrap leader
  ansible.builtin.shell: |
    mkdir -p /home/admin/.kube
    cp /etc/kubernetes/admin.conf /home/admin/.kube/config
    chown -R admin:admin /home/admin/.kube
  when: bootstrap_leader | default(false) | bool

- name: Wait for HAProxy Kubernetes API endpoint to become reachable
  ansible.builtin.wait_for:
    host: "api.{{ internal_domain }}"
    port: "{{ api_port }}"
    timeout: 60
  when: bootstrap_leader | default(false) | bool

- name: Upload control-plane certs and generate join command on bootstrap leader
  ansible.builtin.shell: |
    set -euo pipefail
    CERT_KEY="$(kubeadm init phase upload-certs --upload-certs 2>/dev/null | tail -n 1 | tr -d '\r')"
    JOIN_CMD="$(kubeadm token create --print-join-command | tr -d '\r')"
    echo "${JOIN_CMD}" > /tmp/kubeadm-worker-join.sh
    echo "${JOIN_CMD} --control-plane --certificate-key ${CERT_KEY}" > /tmp/kubeadm-cp-join.sh
  when: bootstrap_leader | default(false) | bool
  changed_when: false

- name: Slurp join commands from bootstrap leader
  ansible.builtin.slurp:
    src: "{{ item }}"
  register: join_files
  loop:
    - /tmp/kubeadm-cp-join.sh
    - /tmp/kubeadm-worker-join.sh
  when: bootstrap_leader | default(false) | bool

- name: Record join commands as facts on bootstrap leader
  ansible.builtin.set_fact:
    cp_join_base: "{{ (join_files.results[0].content | b64decode) | trim }}"
    wk_join_base: "{{ (join_files.results[1].content | b64decode) | trim }}"
  when: bootstrap_leader | default(false) | bool
