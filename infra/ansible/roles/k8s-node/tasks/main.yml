---
- name: Load Kubernetes kernel modules config
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    mode: "0644"
    content: |
      overlay
      br_netfilter

- name: Activate kernel modules immediately
  ansible.builtin.command: "modprobe {{ item }}"
  loop:
    - overlay
    - br_netfilter
  changed_when: false

- name: Configure Kubernetes sysctl parameters
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-k8s.conf
    mode: "0644"
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1
      fs.inotify.max_user_watches         = 524288
      fs.inotify.max_user_instances       = 8192

- name: Apply sysctl settings
  ansible.builtin.command: sysctl --system
  changed_when: false

- name: Install containerd
  ansible.builtin.apt:
    name: containerd
    state: present
    update_cache: true

- name: Generate default containerd config if absent
  ansible.builtin.shell: |
    mkdir -p /etc/containerd /etc/containerd/certs.d
    if [ ! -f /etc/containerd/config.toml ]; then
      containerd config default > /etc/containerd/config.toml
    fi
  args:
    creates: /etc/containerd/config.toml

- name: Enable SystemdCgroup and certs.d registry config_path in containerd
  ansible.builtin.shell: |
    python3 - <<'PY'
    path = "/etc/containerd/config.toml"
    txt = open(path).read()
    new = txt.replace("SystemdCgroup = false", "SystemdCgroup = true")
    # Ensure cri.registry points to /etc/containerd/certs.d
    lines = new.splitlines()
    out = []
    in_reg = False
    for line in lines:
        if '.registry]' in line:
            in_reg = True
        elif line.strip().startswith('[') and in_reg:
            in_reg = False
        if in_reg and 'config_path =' in line:
            indent = line[:len(line) - len(line.lstrip())]
            line = f'{indent}config_path = "/etc/containerd/certs.d"'
        out.append(line)
    result = "\n".join(out) + "\n"
    if result != txt:
        open(path, "w").write(result)
        print("UPDATED")
    PY
  register: containerd_cfg
  changed_when: "'UPDATED' in containerd_cfg.stdout"

- name: Ensure containerd registry certs.d directory for Zot
  ansible.builtin.file:
    path: "/etc/containerd/certs.d/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "zot.{{ internal_domain }}:5000"
    - "{{ ops_ip }}:5000"

- name: Configure containerd hosts.toml for local HTTP Zot registry
  ansible.builtin.template:
    src: hosts.toml.j2
    dest: "/etc/containerd/certs.d/{{ item }}/hosts.toml"
    mode: "0644"
  vars:
    registry_host: "{{ item }}"
  loop:
    - "zot.{{ internal_domain }}:5000"
    - "{{ ops_ip }}:5000"
  notify: Restart containerd

- name: Enable and start containerd
  ansible.builtin.systemd:
    name: containerd
    enabled: true
    state: started

- name: Flush handlers for containerd config
  ansible.builtin.meta: flush_handlers

- name: Install Kubernetes apt repository keyring and source
  ansible.builtin.shell: |
    set -euo pipefail
    mkdir -p /etc/apt/keyrings
    curl -fsSL "https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/Release.key" \
      | gpg --dearmor --yes -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    echo "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/ /" \
      > /etc/apt/sources.list.d/kubernetes.list
  args:
    creates: /etc/apt/sources.list.d/kubernetes.list

- name: Install kubelet, kubeadm, kubectl
  ansible.builtin.apt:
    name:
      - kubelet
      - kubeadm
      - kubectl
    state: present
    update_cache: true

- name: Hold Kubernetes packages at installed minor series
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl

- name: Pin kubelet node-ip to Tart vmnet DHCP address
  ansible.builtin.copy:
    dest: /etc/default/kubelet
    mode: "0644"
    content: |
      KUBELET_EXTRA_ARGS=--node-ip={{ ansible_host }}
  notify: Restart kubelet

- name: Enable kubelet service
  ansible.builtin.systemd:
    name: kubelet
    enabled: true

- name: Ensure local-path-provisioner directory exists on workers
  ansible.builtin.file:
    path: /opt/local-path-provisioner
    state: directory
    mode: "0755"
  when: "'worker' in group_names"
