apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: order-db
  namespace: apps
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:16.6

  bootstrap:
    initdb:
      database: orders
      owner: orderapp
      secret:
        name: order-db-app-creds

  storage:
    size: 3Gi
    storageClass: local-path

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  monitoring:
    enablePodMonitor: true

  backup:
    retentionPolicy: "7d"
    barmanObjectStore:
      destinationPath: "s3://cnpg-backups/"
      endpointURL: "http://s3.macprod.internal:8333"
      s3Credentials:
        accessKeyId:
          name: cnpg-s3-creds
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-s3-creds
          key: SECRET_ACCESS_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: order-db-daily
  namespace: apps
spec:
  schedule: "0 0 3 * * *"
  backupOwnerReference: self
  cluster:
    name: order-db
