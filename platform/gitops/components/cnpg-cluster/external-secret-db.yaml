apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: order-db-app-creds
  namespace: apps
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: order-db-app-creds
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "{{ .DB_USER }}"
        password: "{{ .DB_PASSWORD }}"
  dataFrom:
    - extract:
        key: apps/order-service
