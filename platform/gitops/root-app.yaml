apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: macprod-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: http://gitea.macprod.internal:3000/macprod/gitops.git
    targetRevision: main
    path: platform/gitops/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
